<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice Management</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar span {
            font-size: 14px;
            color: #d1d5db;
        }

        /* =========================
           CONTAINER
        ========================== */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* =========================
           PAGE HEADER
        ========================== */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
        }

        /* =========================
           CARD
        ========================== */

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #1f2937;
        }

        /* =========================
           FORM
        ========================== */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .btn {
            margin-top: 20px;
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* =========================
           ERROR MESSAGE
        ========================== */

        .alert {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        /* =========================
           TABLE
        ========================== */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 13px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        /* =========================
           STATUS
        ========================== */

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-unpaid {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status-partial {
            background: #fef3c7;
            color: #92400e;
        }

        .status-paid {
            background: #dcfce7;
            color: #166534;
        }

        /* =========================
           ACTION LINKS
        ========================== */

        .action-link {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
            margin-right: 10px;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        /* =========================
           PRINT LINK
        ========================== */

        .print-link {
            text-decoration: none;
            color: #059669;
            font-weight: bold;
            margin-right: 10px;
        }

        .print-link:hover {
            text-decoration: underline;
        }

        /* =========================
           DELETE BUTTON
        ========================== */

        .delete-btn {
            border: none;
            background: #dc2626;
            color: white;
            padding: 7px 11px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        /* =========================
           AMOUNT
        ========================== */

        .amount {
            font-weight: bold;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .navbar h1 {
                font-size: 18px;
            }

            .navbar span {
                font-size: 12px;
            }

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: span 1;
            }

            .page-header h2 {
                font-size: 24px;
            }

            .card {
                padding: 18px;
            }
        }

    </style>

</head>

<body>

<!-- =========================
     NAVIGATION
========================== -->

<div class="navbar">

    <h1>Dahamdi Pilgrims & Tours</h1>

    <span>Admin Operations & Billing</span>

</div>


<!-- =========================
     MAIN CONTAINER
========================== -->

<div class="container">


    <!-- =========================
         PAGE HEADER
    ========================== -->

    <div class="page-header">

        <h2>Invoice Management</h2>

        <p>
            Create, view, update and manage customer invoices.
        </p>

    </div>


    <!-- =========================
         ERROR MESSAGE
    ========================== -->

    <div
            th:if="${errorMessage}"
            class="alert">

        <strong th:text="${errorMessage}"></strong>

    </div>


    <!-- =========================
         CREATE INVOICE
    ========================== -->

    <div class="card">

        <h3>Create New Invoice</h3>

        <form
                action="/invoices/add"
                method="post">

            <div class="form-grid">


                <!-- Invoice Number -->

                <div class="form-group">

                    <label for="invoiceNumber">
                        Invoice Number
                    </label>

                    <input
                            type="text"
                            id="invoiceNumber"
                            name="invoiceNumber"
                            placeholder="e.g. INV-0001"
                            required>

                </div>


                <!-- Booking -->

                <div class="form-group">

                    <label for="bookingId">
                        Booking
                    </label>

                    <select
                            id="bookingId"
                            name="bookingId"
                            required>

                        <option value="">
                            -- Select Booking --
                        </option>

                        <option
                                th:each="booking : ${bookings}"
                                th:value="${booking.id}"
                                th:text="${'Booking #' + booking.id + ' - ' + booking.customerName + ' - ' + booking.totalAmount}">

                        </option>

                    </select>

                </div>


                <!-- Customer Name -->

                <div class="form-group">

                    <label for="customerName">
                        Customer Name
                    </label>

                    <input
                            type="text"
                            id="customerName"
                            placeholder="Customer name will appear here"
                            readonly>

                </div>


                <!-- Invoice Date -->

                <div class="form-group">

                    <label for="invoiceDate">
                        Invoice Date
                    </label>

                    <input
                            type="datetime-local"
                            id="invoiceDate"
                            name="invoiceDate"
                            required>

                </div>


                <!-- Total Amount -->

                <div class="form-group">

                    <label for="totalAmount">
                        Total Amount
                    </label>

                    <input
                            type="number"
                            id="totalAmount"
                            step="0.01"
                            min="0"
                            placeholder="Booking amount"
                            readonly>

                </div>


                <!-- Invoice Status -->

                <div class="form-group">

                    <label for="invoiceStatus">
                        Invoice Status
                    </label>

                    <select
                            id="invoiceStatus"
                            name="invoiceStatus"
                            required>

                        <option value="UNPAID">
                            UNPAID
                        </option>

                        <option value="PARTIAL">
                            PARTIAL
                        </option>

                        <option value="PAID">
                            PAID
                        </option>

                    </select>

                </div>

            </div>


            <button
                    type="submit"
                    class="btn">

                + Create Invoice

            </button>

        </form>

    </div>


    <!-- =========================
         INVOICE LIST
    ========================== -->

    <div class="card">

        <h3>All Invoices</h3>

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Invoice Number</th>

                    <th>Customer</th>

                    <th>Date</th>

                    <th>Total</th>

                    <th>Paid</th>

                    <th>Outstanding</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="invoice : ${invoices}">

                    <!-- ID -->

                    <td
                            th:text="${invoice.invoiceId}">
                    </td>


                    <!-- Invoice Number -->

                    <td
                            th:text="${invoice.invoiceNumber}">
                    </td>


                    <!-- Customer -->

                    <td
                            th:text="${invoice.customerName}">
                    </td>


                    <!-- Date -->

                    <td
                            th:text="${invoice.invoiceDate}">
                    </td>


                    <!-- Total -->

                    <td
                            class="amount"
                            th:text="${invoice.totalAmount}">
                    </td>


                    <!-- Paid -->

                    <td
                            class="amount"
                            th:text="${paidAmounts[invoice.invoiceId]}">
                    </td>


                    <!-- Outstanding -->

                    <td
                            class="amount"
                            th:text="${outstandingBalances[invoice.invoiceId]}">
                    </td>


                    <!-- Status -->

                    <td>

                        <span
                                class="status"
                                th:classappend="${calculatedStatuses[invoice.invoiceId] == 'PAID'
                                    ? ' status-paid'
                                    : calculatedStatuses[invoice.invoiceId] == 'PARTIAL'
                                    ? ' status-partial'
                                    : ' status-unpaid'}"
                                th:text="${calculatedStatuses[invoice.invoiceId]}">

                        </span>

                    </td>


                    <!-- Actions -->

                    <td>

                        <!-- Edit -->

                        <a
                                class="action-link"
                                th:href="@{/invoices/edit/{id}(id=${invoice.invoiceId})}">

                            Edit

                        </a>


                        <!-- Print -->

                        <a
                                class="print-link"
                                th:href="@{/invoices/print/{id}(id=${invoice.invoiceId})}"
                                target="_blank">

                            Print

                        </a>


                        <!-- Delete -->

                        <form
                                th:action="@{/invoices/delete/{id}(id=${invoice.invoiceId})}"
                                method="post"
                                style="display:inline;">

                            <button
                                    type="submit"
                                    class="delete-btn"
                                    onclick="return confirm('Are you sure you want to delete this invoice?')">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- =========================
     BOOKING DETAILS SCRIPT
========================== -->

<script>

    const bookingSelect =
        document.getElementById("bookingId");

    const customerNameInput =
        document.getElementById("customerName");

    const totalAmountInput =
        document.getElementById("totalAmount");


    bookingSelect.addEventListener("change", function () {

        const bookingId = this.value;


        if (!bookingId) {

            customerNameInput.value = "";
            totalAmountInput.value = "";

            return;
        }


        fetch("/api/airline/bookings/" + bookingId)

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Booking could not be loaded."
                    );

                }

                return response.json();

            })

            .then(booking => {

                customerNameInput.value =
                    booking.customerName;

                totalAmountInput.value =
                    booking.totalAmount;

            })

            .catch(error => {

                console.error(
                    "Error loading booking:",
                    error
                );

                alert(
                    "Unable to load booking information."
                );

                customerNameInput.value = "";
                totalAmountInput.value = "";

            });

    });

</script>


</body>

</html>

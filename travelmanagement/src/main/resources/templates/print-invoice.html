<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Invoice - Print</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
            color: #222;
        }

        .invoice {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 40px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #222;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .company h1 {
            margin: 0;
            font-size: 28px;
        }

        .company p {
            margin: 5px 0;
            color: #666;
        }

        .invoice-title {
            text-align: right;
        }

        .invoice-title h2 {
            margin: 0;
            font-size: 30px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .detail-box {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .detail-box strong {
            display: block;
            margin-bottom: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .summary {
            width: 350px;
            margin-left: auto;
            margin-top: 30px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
        }

        .total {
            border-top: 2px solid #222;
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            font-weight: bold;
        }

        .print-button {
            display: block;
            margin: 30px auto 0;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .print-button:hover {
            background: #1d4ed8;
        }

        @media print {

            body {
                background: white;
                padding: 0;
            }

            .invoice {
                box-shadow: none;
                max-width: none;
            }

            .print-button {
                display: none;
            }

        }

    </style>

</head>

<body>

<div class="invoice">

    <div class="header">

        <div class="company">

            <h1>Dahamdi Pilgrims & Tours</h1>

            <p>Admin Operations & Billing</p>

        </div>

        <div class="invoice-title">

            <h2>INVOICE</h2>

            <p>
                <strong th:text="${invoice.invoiceNumber}">
                </strong>
            </p>

        </div>

    </div>


    <div class="details">

        <div class="detail-box">

            <strong>Customer</strong>

            <span th:text="${invoice.customerName}">
            </span>

        </div>


        <div class="detail-box">

            <strong>Invoice Date</strong>

            <span th:text="${invoice.invoiceDate}">
            </span>

        </div>

    </div>


    <table>

        <thead>

        <tr>

            <th>Description</th>

            <th>Amount</th>

        </tr>

        </thead>

        <tbody>

        <tr>

            <td>
                Travel Service Invoice
            </td>

            <td
                    th:text="${invoice.totalAmount}">
            </td>

        </tr>

        </tbody>

    </table>


    <div class="summary">

        <div class="summary-row">

            <span>Total Amount</span>

            <strong
                    th:text="${invoice.totalAmount}">
            </strong>

        </div>


        <div class="summary-row">

            <span>Paid Amount</span>

            <strong
                    th:text="${paidAmount}">
            </strong>

        </div>


        <div class="summary-row">

            <span>Outstanding Balance</span>

            <strong
                    th:text="${outstandingBalance}">
            </strong>

        </div>


        <div class="summary-row">

            <span>Status</span>

            <strong
                    class="status"
                    th:text="${calculatedStatus}">
            </strong>

        </div>


        <div class="summary-row total">

            <span>Total</span>

            <strong
                    th:text="${invoice.totalAmount}">
            </strong>

        </div>

    </div>


    <button
            class="print-button"
            onclick="window.print()">

        🖨 Print Invoice

    </button>

</div>

</body>

</html>

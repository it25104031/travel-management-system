<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar span {
            font-size: 14px;
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #1f2937;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .btn {
            margin-top: 20px;
            padding: 11px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .alert {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 13px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-failed {
            background: #fee2e2;
            color: #b91c1c;
        }

        .action-link {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
            margin-right: 10px;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .delete-btn {
            border: none;
            background: #dc2626;
            color: white;
            padding: 7px 11px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .amount {
            font-weight: bold;
        }

        .invoice-info {
            margin-top: 8px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 6px;
            color: #4b5563;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .page-header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<!-- Navigation -->
<div class="navbar">

    <h1>Dahamdi Pilgrims & Tours</h1>

    <span>Admin Operations & Billing</span>

</div>


<div class="container">

    <!-- Page Header -->
    <div class="page-header">

        <h2>Payment Management</h2>

        <p>
            Record, view, update and manage customer payments.
        </p>

    </div>


    <!-- Error Message -->
    <div
            th:if="${errorMessage}"
            class="alert">

        <strong th:text="${errorMessage}"></strong>

    </div>


    <!-- Add Payment -->
    <div class="card">

        <h3>Record New Payment</h3>

        <form action="/payments/add" method="post">

            <div class="form-grid">

                <!-- Invoice -->
                <div class="form-group">

                    <label for="invoiceId">
                        Invoice
                    </label>

                    <select
                            id="invoiceId"
                            name="invoiceId"
                            required>

                        <option value="">
                            -- Select Invoice --
                        </option>

                        <option
                                th:each="invoice : ${invoices}"
                                th:value="${invoice.invoiceId}"
                                th:text="${invoice.invoiceNumber + ' - ' + invoice.customerName}">
                        </option>

                    </select>

                </div>


                <!-- Payment Date -->
                <div class="form-group">

                    <label for="paymentDate">
                        Payment Date
                    </label>

                    <input
                            type="datetime-local"
                            id="paymentDate"
                            name="paymentDate"
                            required>

                </div>


                <!-- Amount -->
                <div class="form-group">

                    <label for="amount">
                        Payment Amount
                    </label>

                    <input
                            type="number"
                            id="amount"
                            name="amount"
                            step="0.01"
                            min="0"
                            placeholder="0.00"
                            required>

                </div>


                <!-- Payment Method -->
                <div class="form-group">

                    <label for="paymentMethod">
                        Payment Method
                    </label>

                    <select
                            id="paymentMethod"
                            name="paymentMethod"
                            required>

                        <option value="">
                            -- Select Method --
                        </option>

                        <option value="CASH">
                            Cash
                        </option>

                        <option value="CARD">
                            Card
                        </option>

                        <option value="BANK_TRANSFER">
                            Bank Transfer
                        </option>

                        <option value="ONLINE">
                            Online Payment
                        </option>

                    </select>

                </div>


                <!-- Payment Status -->
                <div class="form-group">

                    <label for="paymentStatus">
                        Payment Status
                    </label>

                    <select
                            id="paymentStatus"
                            name="paymentStatus"
                            required>

                        <option value="COMPLETED">
                            COMPLETED
                        </option>

                        <option value="PENDING">
                            PENDING
                        </option>

                        <option value="FAILED">
                            FAILED
                        </option>

                    </select>

                </div>

            </div>


            <button
                    type="submit"
                    class="btn">

                + Record Payment

            </button>

        </form>

    </div>


    <!-- Payment List -->
    <div class="card">

        <h3>All Payments</h3>

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Invoice</th>

                    <th>Customer</th>

                    <th>Date</th>

                    <th>Amount</th>

                    <th>Method</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="payment : ${payments}">

                    <td th:text="${payment.paymentId}">
                    </td>

                    <td
                            th:text="${payment.invoice.invoiceNumber}">
                    </td>

                    <td
                            th:text="${payment.invoice.customerName}">
                    </td>

                    <td
                            th:text="${payment.paymentDate}">
                    </td>

                    <td
                            class="amount"
                            th:text="${payment.amount}">
                    </td>

                    <td
                            th:text="${payment.paymentMethod}">
                    </td>

                    <td>

                        <span
                                class="status"
                                th:classappend="${payment.paymentStatus == 'COMPLETED'
                                    ? ' status-completed'
                                    : payment.paymentStatus == 'PENDING'
                                    ? ' status-pending'
                                    : ' status-failed'}"
                                th:text="${payment.paymentStatus}">

                        </span>

                    </td>

                    <td>

                        <a
                                class="action-link"
                                th:href="@{/payments/edit/{id}(id=${payment.paymentId})}">

                            Edit

                        </a>


                        <form
                                th:action="@{/payments/delete/{id}(id=${payment.paymentId})}"
                                method="post"
                                style="display:inline;">

                            <button
                                    type="submit"
                                    class="delete-btn"
                                    onclick="return confirm('Are you sure you want to delete this payment?')">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>

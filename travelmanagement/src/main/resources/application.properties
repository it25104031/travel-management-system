spring.application.name=travelmanagement
server.port=8081

# Database - override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD
# (defaults keep the local XAMPP/MySQL setup working: root with no password)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_management_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Session cookie: not readable by JavaScript, and not sent on cross-site form posts (basic CSRF protection)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# File upload properties
file.upload-dir=uploads/payment-slips
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

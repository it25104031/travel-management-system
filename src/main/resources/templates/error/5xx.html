<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Something went wrong')}"></head>
<body class="site">
<header th:replace="~{layout/fragments :: siteHeader('')}"></header>
<main id="main" class="site-main">
    <div class="wrap-narrow">
        <div class="empty-state">
            <h2>Something went wrong on our side</h2>
            <p>The page couldn't be loaded. Please try again in a moment; if it keeps happening, contact us.</p>
            <div class="actions" style="justify-content:center">
                <a class="btn" href="/">Go to the home page</a>
                <a class="btn btn-outline" href="/tours">Browse tours</a>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{layout/fragments :: siteFooter}"></footer>
</body>
</html>

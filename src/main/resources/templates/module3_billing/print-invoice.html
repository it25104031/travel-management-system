<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{layout/fragments :: headLinks('Invoice ' + ${invoice.invoiceNumber})}"></th:block>
    <style>
        body { background: var(--paper); }
        .sheet { max-width: 800px; margin: 32px auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 48px; }
        .sheet-head { display: flex; justify-content: space-between; gap: 24px; border-bottom: 3px solid var(--indigo); padding-bottom: 22px; margin-bottom: 26px; }
        .sheet-head .brand { color: var(--indigo); }
        .sheet-head address { font-style: normal; color: var(--ink-2); font-size: 13px; margin-top: 10px; line-height: 1.6; }
        .doc-title { text-align: right; }
        .doc-title h1 { font-size: 34px; margin: 0; letter-spacing: -0.02em; }
        .doc-title p { margin: 4px 0 0; color: var(--ink-2); }
        .bill-to { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 26px; }
        .bill-to h4 { color: var(--ink-3); font-family: var(--font-body); font-size: 12px; margin-bottom: 4px; }
        .totals { margin-left: auto; width: 320px; margin-top: 18px; }
        .totals div { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--mist); font-size: 14px; }
        .totals div.due { border-bottom: 0; border-top: 2px solid var(--indigo); font-weight: 800; font-size: 18px; color: var(--indigo); padding-top: 12px; }
        .pay-note { margin-top: 30px; padding: 14px 16px; background: var(--paper); border-radius: var(--radius-s); font-size: 13px; color: var(--ink-2); }
        .print-bar { max-width: 800px; margin: 20px auto 0; display: flex; justify-content: flex-end; gap: 8px; }
        @media print { body { background: #fff; } .sheet { border: 0; margin: 0; padding: 0; } .print-bar { display: none; } }
    </style>
</head>
<body>
<div class="print-bar">
    <a class="btn btn-ghost" href="/billing/invoices">Back to invoices</a>
    <button class="btn" type="button" onclick="window.print()">Print</button>
</div>
<div class="sheet">
    <div class="sheet-head">
        <div>
            <span class="brand"><svg th:replace="~{layout/fragments :: mark}"></svg><span class="brand-name" th:text="${site.name}">Name</span></span>
            <address><span th:text="${site.address}">address</span><br><span th:text="${site.phone}">phone</span> &nbsp; <span th:text="${site.email}">email</span></address>
        </div>
        <div class="doc-title">
            <h1>Invoice</h1>
            <p th:text="${invoice.invoiceNumber}">INV</p>
            <p><span class="badge" th:classappend="'badge-' + ${calculatedStatus}" th:text="${calculatedStatus}">UNPAID</span></p>
        </div>
    </div>
    <div class="bill-to">
        <div><h4>Billed to</h4><b th:text="${invoice.customerName}">Customer</b></div>
        <div><h4>Invoice date</h4><span th:text="${#temporals.format(invoice.invoiceDate, 'd MMMM yyyy')}">date</span></div>
    </div>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Description</th><th class="num">Amount (LKR)</th></tr></thead>
            <tbody><tr><td>Travel services</td><td class="num" th:text="${#numbers.formatDecimal(invoice.totalAmount, 1, 'COMMA', 2, 'POINT')}">0</td></tr></tbody>
        </table>
    </div>
    <div class="totals">
        <div><span>Total</span><span th:text="${#numbers.formatDecimal(invoice.totalAmount, 1, 'COMMA', 2, 'POINT')}">0</span></div>
        <div><span>Paid</span><span th:text="${#numbers.formatDecimal(paidAmount, 1, 'COMMA', 2, 'POINT')}">0</span></div>
        <div class="due"><span>Balance due (LKR)</span><span th:text="${#numbers.formatDecimal(outstandingBalance, 1, 'COMMA', 2, 'POINT')}">0</span></div>
    </div>
    <div class="pay-note">
        Transfer to <b th:text="${site.bankName}">bank</b>,
        account <b th:text="${site.bankAccountNumber}">no</b> (<span th:text="${site.bankAccountName}">name</span>, <span th:text="${site.bankBranch}">branch</span>)
        using <b th:text="${invoice.invoiceNumber}">INV</b> as the reference.
    </div>
</div>
</body>
</html>

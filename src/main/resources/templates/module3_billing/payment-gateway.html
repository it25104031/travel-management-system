<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Card payments')}"></head>
<body class="staff">
<th:block th:replace="~{layout/fragments :: staffNav}"></th:block>
<main id="main" class="page" style="max-width:820px">
    <div class="coming-soon panel">
        <svg th:replace="~{layout/icons :: card}"></svg>
        <h1>Card payments are coming soon</h1>
        <p>Online card payments will be switched on once the agency's merchant account with the payment gateway (LankaPay) is approved.
            Until then, travellers pay by bank transfer and upload their slip from their profile.</p>
        <div class="actions" style="justify-content:center">
            <a class="btn btn-accent" href="/billing/slips?status=PENDING">Review bank slips</a>
            <a class="btn btn-outline" href="/billing/payments">Record a cash or bank payment</a>
        </div>
    </div>
</main>
<script src="/js/staff.js"></script>
</body>
</html>

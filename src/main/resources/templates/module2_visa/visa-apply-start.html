<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head(${country.countryName} + ' visa application')}"></head>
<body class="site">
<header th:replace="~{layout/fragments :: siteHeader('visas')}"></header>
<main id="main" class="site-main">
    <div class="wrap-narrow">
        <div class="crumbs" style="color:var(--ink-3)"><a href="/visas/select-country">Visas</a> / <span th:text="${country.countryName}">India</span></div>
        <div class="page-title"><div><h1 th:text="${country.countryName} + ' visa application'">India visa application</h1>
            <p>Choose your visa type and nationality. We'll show exactly which documents to upload.</p></div></div>
        <form class="panel" method="get" th:action="${form.route}">
            <div class="field">
                <label for="visaTypeId">Visa type</label>
                <select id="visaTypeId" name="visaTypeId" required>
                    <option th:each="t : ${visaTypes}" th:value="${t.id}"
                            th:text="${t.name} + ' - ' + ${t.fee} + ' ' + ${t.currency} + ', about ' + ${t.processingDays} + ' working days'"></option>
                </select>
            </div>
            <div class="field">
                <label for="nationality">Nationality (as in your passport)</label>
                <input id="nationality" type="text" name="nationality" placeholder="e.g. Sri Lankan" required>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-accent">Continue to the form</button>
                <a href="/visas/select-country" class="btn btn-ghost">Back</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{layout/fragments :: siteFooter}"></footer>
<script src="/js/site.js"></script>
</body>
</html>

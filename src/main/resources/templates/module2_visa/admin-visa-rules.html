<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Visa Rules')}"></head>
<body class="staff">
<th:block th:replace="~{layout/fragments :: staffNav}"></th:block>
<main id="main" class="page">
    <div class="panel">
        <h2>Visa Rules &amp; Required Documents</h2>
        <div th:replace="~{layout/fragments :: messages}"></div>

        <h3>Add Visa Type</h3>
        <form th:action="@{/admin/visa-rules/types}" method="post" class="row">
            <div><label>Country</label>
                <select name="countryId"><option th:each="c : ${countries}" th:value="${c.id}" th:text="${c.countryName}"></option></select></div>
            <div><label>Name</label><input type="text" name="name" placeholder="e.g. ePILGRIM VISA" required></div>
            <div><label>Category</label>
                <select name="category">
                    <option>TOURIST_EVISA</option><option>PILGRIM</option><option>GROUP</option><option>TRANSIT</option>
                    <option>SPECIAL_PERMIT</option><option>BUSINESS</option><option>MEDICAL</option>
                </select></div>
            <div style="min-width:90px;"><label>Fee</label><input type="number" step="0.01" name="fee"></div>
            <div style="min-width:70px;"><label>Currency</label><input type="text" name="currency" value="USD"></div>
            <div style="min-width:90px;"><label>Processing days</label><input type="number" name="processingDays" value="5"></div>
            <div style="flex:0;"><button type="submit" class="btn btn-green">Add</button></div>
        </form>
    </div>

    <div class="panel" th:each="t : ${visaTypes}" th:id="'type-' + ${t.id}">
        <h3 style="margin-top:0;">
            <span th:text="${t.country.countryName} + ' · ' + ${t.name}"></span>
            <span class="badge" th:text="${t.category}"></span>
            <span class="badge" th:classappend="${t.active} ? 'badge-green' : 'badge-gray'" th:text="${t.active} ? 'Active' : 'Inactive'"></span>
        </h3>
        <form th:action="@{/admin/visa-rules/types/{id}(id=${t.id})}" method="post" class="row">
            <div><label>Fee (<span th:text="${t.currency}"></span>)</label><input type="number" step="0.01" name="fee" th:value="${t.fee}"></div>
            <div><label>Processing days</label><input type="number" name="processingDays" th:value="${t.processingDays}"></div>
            <div><label><input type="checkbox" name="active" value="true" th:checked="${t.active}"> Active</label></div>
            <div style="flex:0;"><button type="submit" class="btn btn-sm">Save</button></div>
        </form>

        <table>
            <thead><tr><th>Code</th><th>Label</th><th>Nationality</th><th>Formats</th><th>Max MB</th><th>Min px</th><th>Mandatory</th><th></th></tr></thead>
            <tbody>
            <tr th:each="r : ${rulesByType.get(t.id)}">
                <td th:text="${r.docCode}"></td>
                <td th:text="${r.label}"></td>
                <td th:text="${r.nationality} ?: 'All'"></td>
                <td th:text="${r.allowedFormats}"></td>
                <td th:text="${r.maxSizeMb}"></td>
                <td th:text="${r.minWidthPx != null} ? ${r.minWidthPx} + 'x' + ${r.minHeightPx} : '-'"></td>
                <td th:text="${r.mandatory} ? 'Yes' : 'Optional'"></td>
                <td>
                    <form th:action="@{/admin/visa-rules/documents/{rid}/delete(rid=${r.id})}" method="post" class="inline"
                          onsubmit="return confirm('Remove this document rule?');">
                        <input type="hidden" name="typeId" th:value="${t.id}">
                        <button type="submit" class="btn btn-red btn-sm">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <form th:action="@{/admin/visa-rules/types/{id}/documents(id=${t.id})}" method="post" class="row" style="margin-top: 12px;">
            <div style="min-width:110px;"><label>Code</label><input type="text" name="docCode" placeholder="PHOTO" required></div>
            <div style="min-width:200px;"><label>Label</label><input type="text" name="label" required></div>
            <div style="min-width:110px;"><label>Nationality (blank = all)</label><input type="text" name="nationality"></div>
            <div style="min-width:110px;"><label>Formats</label><input type="text" name="allowedFormats" value="jpg,jpeg,png,pdf"></div>
            <div style="min-width:70px;"><label>Max MB</label><input type="number" name="maxSizeMb" value="5" min="1"></div>
            <div style="min-width:70px;"><label>Min W px</label><input type="number" name="minWidthPx"></div>
            <div style="min-width:70px;"><label>Min H px</label><input type="number" name="minHeightPx"></div>
            <div style="min-width:80px;"><label><input type="checkbox" name="mandatory" value="true" checked> Mandatory</label></div>
            <div style="flex:0;"><button type="submit" class="btn btn-green btn-sm">Add rule</button></div>
        </form>
    </div>
</main>
<script src="/js/staff.js"></script>
</body>
</html>

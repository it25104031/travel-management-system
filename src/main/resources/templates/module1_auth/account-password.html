<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Change Password')}"></head>
<body class="staff">
<th:block th:replace="~{layout/fragments :: staffNav}"></th:block>
<main id="main" class="page" style="max-width: 520px;">
    <div class="panel">
        <h2>Change Your Password</h2>
        <div th:if="${param.forced}" class="alert alert-info">
            An administrator reset your password. Please choose a new one before continuing.
        </div>
        <div th:replace="~{layout/fragments :: messages}"></div>
        <form th:action="@{/account/password}" method="post">
            <div class="row"><div><label>Current password</label><input type="password" name="currentPassword" required></div></div>
            <div class="row"><div><label th:text="'New password (min ' + ${minLength} + ' characters)'">New password</label>
                <input type="password" name="newPassword" th:attr="minlength=${minLength}" required></div></div>
            <div class="row"><div><label>Confirm new password</label><input type="password" name="confirmPassword" required></div></div>
            <button type="submit" class="btn btn-green">Update password</button>
        </form>
    </div>
</main>
<script src="/js/staff.js"></script>
</body>
</html>

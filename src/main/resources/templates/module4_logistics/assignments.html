<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Assignments')}"></head>
<body class="staff">
<th:block th:replace="~{layout/fragments :: staffNav}"></th:block>
<main id="main" class="page">
    <div class="page-title">
        <div><h1>Assignments</h1><p>Who travels with each departure. Cost is worked out from the daily rate, and nobody can be booked on two trips at once.</p></div>
    </div>
    <div th:replace="~{layout/fragments :: messages}"></div>

    <form class="panel" method="post" th:action="${editing != null ? '/logistics/assignments/' + editing.id + '/edit' : '/logistics/assignments'}" id="recordForm">
        <h2 th:text="${editing != null ? 'Edit assignment' : 'Assign a guide or driver'}">Assign a guide or driver</h2>
        <div class="form-grid">
                <div><label for="f-guideId">Person</label><select id="f-guideId" name="guideId" required><option value="" th:selected="${editing == null}" disabled>Choose a person...</option><option th:each="guide : ${guides}" th:value="${guide.id}" th:text="${guide.name + ' (' + #strings.capitalize(#strings.toLowerCase(guide.role)) + ')'}" th:selected="${editing != null and #strings.toString(editing.guideId) == #strings.toString(guide.id)}"></option></select></div>
                <div><label for="f-departureId">Departure</label><select id="f-departureId" name="departureId" required><option value="" th:selected="${editing == null}" disabled>Choose a departure...</option><option th:each="departure : ${departures}" th:value="${departure.id}" th:text="${departure.reference + ' - ' + departure.destination}" th:selected="${editing != null and #strings.toString(editing.departureId) == #strings.toString(departure.id)}"></option></select></div>
                <div><label for="f-startDate">From</label><input id="f-startDate" type="date" name="startDate" required th:value="${editing != null ? editing.startDate : ''}"></div>
                <div><label for="f-endDate">Until</label><input id="f-endDate" type="date" name="endDate" required th:value="${editing != null ? editing.endDate : ''}"></div>
        </div>
        <div class="actions">
            <button type="submit" class="btn" th:text="${editing != null ? 'Save changes' : 'Assign person'}">Assign person</button>
            <a class="btn btn-ghost" th:if="${editing != null}" href="/logistics/assignments">Cancel</a>
        </div>
    </form>

    <form method="post" action="/logistics/assignments/delete" data-bulk>
        <div class="toolbar">
            <div class="grow"><label for="q">Search</label><input id="q" type="search" data-filter="#recordTable" placeholder="Departure or person"></div>
            <div th:if="${!#lists.isEmpty(assignments)}">
                <button type="button" class="btn btn-red" data-bulk-start>Delete records</button>
                <span class="actions" data-bulk-bar hidden>
                    <button type="submit" class="btn btn-red" data-bulk-delete disabled>Delete selected (0)</button>
                    <button type="button" class="btn btn-ghost" data-bulk-cancel>Cancel</button>
                </span>
            </div>
        </div>
        <div class="table-wrap">
            <table id="recordTable">
                <thead><tr><th class="sel-col" hidden><span class="sr-only">Select</span></th><th>Departure</th><th>Person</th><th>Dates</th><th class="num">Cost (LKR)</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${assignments}">
                    <td class="sel-col" hidden><input type="checkbox" name="ids" th:value="${r.id}" aria-label="Select record" disabled></td>
                    <td th:text="${r.departure.reference}"></td><td th:text="${r.guide.name}"></td><td class="nowrap" th:text="${#temporals.format(r.startDate, 'd MMM')} + ' - ' + ${#temporals.format(r.endDate, 'd MMM yyyy')}"></td><td class="num" th:text="${#numbers.formatDecimal(r.cost, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td><a class="btn btn-outline btn-sm" th:href="@{/logistics/assignments/{id}/edit(id=${r.id})}">Edit</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(assignments)}" data-empty><td th:colspan="6" class="empty">Nobody assigned yet.</td></tr>
                </tbody>
            </table>
        </div>
    </form>
</main>
<script src="/js/staff.js"></script>
</body>
</html>

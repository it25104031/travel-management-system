<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/fragments :: head('Edit itinerary day')}"></head>
<body class="staff">
<th:block th:replace="~{layout/fragments :: staffNav}"></th:block>
<main id="main" class="page" style="max-width:760px">
    <div class="page-title">
        <div><h1 th:text="'Day ' + ${itinerary.dayNumber}">Day 1</h1>
            <p><a href="/packages">Tour packages</a> / <a th:href="@{/itineraries/{id}(id=${tourPackage.packageId})}" th:text="${tourPackage.packageName}">Package</a> / Edit day</p></div>
    </div>
    <div th:replace="~{layout/fragments :: messages}"></div>
    <form class="panel" th:action="@{/itineraries/update/{id}(id=${itinerary.itineraryId})}" method="post">
        <div class="form-grid">
            <div><label for="dayNumber">Day</label><input id="dayNumber" type="number" name="dayNumber" min="1" th:max="${tourPackage.duration}" th:value="${itinerary.dayNumber}" required></div>
            <div><label for="destination">Destination</label><input id="destination" type="text" name="destination" maxlength="100" th:value="${itinerary.destination}" required></div>
            <div class="span-all"><label for="activities">Activities</label><textarea id="activities" name="activities" maxlength="1000" required th:text="${itinerary.activities}"></textarea></div>
            <div><label for="accommodation">Accommodation</label><input id="accommodation" type="text" name="accommodation" maxlength="255" th:value="${itinerary.accommodation}"></div>
            <div><label for="transport">Transport</label><input id="transport" type="text" name="transport" maxlength="255" th:value="${itinerary.transport}"></div>
        </div>
        <div class="actions">
            <button type="submit" class="btn">Save day</button>
            <a th:href="@{/itineraries/{id}(id=${tourPackage.packageId})}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</main>
<script src="/js/staff.js"></script>
</body>
</html>

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/travel_erp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000
    username: root
    password:
  jpa:
    database-platform: com.travel.common.TeamSchemaMySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8082
  tomcat:
    max-part-count: 500
    max-swallow-size: -1
  servlet:
    session:
      timeout: 30m

app:
  upload-dir: uploads
  mail:
    from: no-reply@travel-erp.local
  staff:
    session-timeout-minutes: 30
  customer:
    passkey-validity-days: 30
    session-timeout-minutes: 15
    portal-url: http://localhost:8082/portal/login
  security:
    max-failed-attempts: 5
    lockout-minutes: 15
  scheduler:
    daily-cron: "0 0 7 * * *"

  demo-data: true
  site:
    name: "Dahamde Pilgrims & Tours"
    tagline: Pilgrimages, holidays and visas - planned end to end.
    phone: "077 811 4262"
    email: dhanuskape@gmail.com
    address: '59/10 "Samadhi Garden", Pannipitiya 10230, Sri Lanka'
    hours: ""
    whatsapp: https://wa.me/94777138924
    facebook: https://www.facebook.com/p/Dahamde-Pilgrims-Tours-61591633416052/
    instagram: ""
    youtube: ""
    tiktok: ""
    bank-name: "[Bank name]"
    bank-account-name: "Dahamde Pilgrims & Tours"
    bank-account-number: "[Account number]"
    bank-branch: "[Branch]"

file:
  upload-dir: uploads/payment-slips
